# =================================================================
# MINI-ASSISTANT ENTERPRISE - PRODUÇÃO AUTÔNOMA (ALL-IN-ONE)
# =================================================================
services:
  # 1. Banco de Dados Relacional & Vetorial (pgvector)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mini_assistant_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-mini_assistant}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: always

  # 2. Fila Assíncrona de Mensagens (Redis)
  redis:
    image: redis:alpine
    container_name: mini_assistant_redis_prod
    ports:
      - '6380:6379'
    restart: always

  # 3. Motor Backend & Dashboard Administrativo
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-assistant:latest
    container_name: mini_assistant_api_prod
    ports:
      - '80:3000'
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  pgdata_prod:
